<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1" />
  <title>IQly — Variant 2: Shorter Quiz</title>
  <link rel="icon" href="data:," />

  <link rel="stylesheet" href="styles/tokens.css" />
  <link rel="stylesheet" href="styles/base.css" />
  <link rel="stylesheet" href="styles/components.css" />
</head>
<body>
  <div id="app"></div>

  <script src="src/config.js"></script>
  <script src="src/questions.js"></script>
  <script src="src/scoring.js"></script>
  <script src="src/tracking.js"></script>
  <script src="src/state.js"></script>
  <script src="src/screens.js"></script>
  <script src="src/render.js"></script>
  <script src="src/debug.js"></script>

  <script>
    // TEST 2 — funnel step: quiz start -> completion.
    // Hypothesis: a shorter quiz lowers the time-commitment and mid-quiz
    // abandonment risk, at the possible cost of a "thinner"-feeling result
    // (fewer data points behind the category breakdown). Question selection
    // is handled by scoring.js's selectQuestions() helper, which draws
    // proportionally across categories rather than hardcoding "first N" —
    // so this override never silently drops a category from the result
    // (docs/part2-spec.md, Test 2).
    IQLY.CONFIG.flow.questionCount = 5;
    IQLY.CONFIG.tracking.variantId = 'variant-2-shorter-quiz';
  </script>

  <script src="src/main.js"></script>
</body>
</html>
