<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>IQly — Banner 320x50</title>
<link rel="stylesheet" href="../styles/tokens.css">
<style>
  /* Creative-only layout. Colors/type/radius all come from tokens.css —
     no hardcoded hex values here, per part3-spec.md's shared build rule. */
  html, body {
    margin: 0;
    padding: 0;
    width: 320px;
    height: 50px;
    overflow: hidden;
    font-family: var(--font-family);
    background: var(--color-bg);
  }

  /* table/table-cell, not flexbox: the export renderer (old Qt WebKit,
     see docs/creatives/export.js) has unreliable flexbox support at this
     size, so this layout leans on box model primitives every WebKit build
     handles the same way. */
  a.banner {
    display: table;
    width: 320px;
    height: 50px;
    box-sizing: border-box;
    background: var(--color-bg);
    border: 1px solid var(--color-border);
    text-decoration: none;
    color: var(--color-text);
    border-collapse: collapse;
  }

  .cell {
    display: table-cell;
    vertical-align: middle;
  }

  .mark {
    width: 40px;
    padding-left: 8px;
  }
  .mark svg { width: 28px; height: 28px; display: block; }

  /* Copy budget: mark stands alone (no text wordmark) — the ~170px of
     remaining width goes entirely to the value claim + CTA, per
     part3-spec.md's call to pick one, not fit both at full size. */
  .claim {
    font-size: 12px;
    font-weight: var(--font-weight-medium);
    line-height: 1.15;
    color: var(--color-text);
  }
  .claim .sub {
    display: block;
    font-size: 10px;
    font-weight: var(--font-weight-regular);
    color: var(--color-text-muted);
  }

  .cta-cell {
    width: 56px;
    padding-right: 8px;
    text-align: right;
  }
  /* Styled to read as a button (background, radius, weight) but a
     non-interactive <span>, not an actual <button> — nesting a <button>
     inside the wrapping <a> is invalid HTML (interactive content inside
     interactive content) and rendered inconsistently across engines,
     wkhtmltoimage's WebKit included. Confirmed as a defect in the first
     build; see part3-spec.md's Creative 1 implementation notes. */
  .cta {
    display: inline-block;
    box-sizing: border-box;
    background: var(--color-primary);
    color: var(--color-primary-contrast);
    font-family: var(--font-family);
    font-size: 12px;
    font-weight: var(--font-weight-bold);
    padding: 0 10px;
    height: 32px;
    line-height: 32px;
    border-radius: var(--radius-sm);
  }
</style>
</head>
<body>
  <a class="banner" href="../index.html" target="_top">
    <span class="cell mark">
      <svg viewBox="0 0 64 64" width="28" height="28" aria-hidden="true">
        <circle cx="24" cy="24" r="14" fill="var(--color-primary)" opacity="0.85"/>
        <rect x="30" y="30" width="24" height="24" rx="4" fill="var(--color-primary)" opacity="0.55"/>
        <polygon points="16,52 28,52 22,40" fill="var(--color-primary)" opacity="0.7"/>
      </svg>
    </span>
    <span class="cell claim">
      What's your IQ?
      <span class="sub">Free · 2 min</span>
    </span>
    <span class="cell cta-cell">
      <span class="cta">Start</span>
    </span>
  </a>
</body>
</html>
