<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>IQly — Square 250x250</title>
<link rel="stylesheet" href="../styles/tokens.css">
<style>
  /* Creative-only layout. Colors/type/radius come from tokens.css — no
     hardcoded hex values here. Text-only by explicit decision (see
     part3-spec.md's Creative 2 revision note): the first build used a
     svgGrid() pattern question, cut after review because that specific
     question's answer was visually obvious at a glance, closing the
     curiosity gap instead of opening it. Table/table-cell layout, not
     flexbox — see creatives/export.js for why. */
  html, body {
    margin: 0;
    padding: 0;
    width: 250px;
    height: 250px;
    overflow: hidden;
    font-family: var(--font-family);
    background: var(--color-bg);
  }

  .wrap {
    display: table;
    box-sizing: border-box;
    width: 250px;
    height: 250px;
    border: 1px solid var(--color-border);
  }
  .content {
    display: table-cell;
    vertical-align: middle;
    box-sizing: border-box;
    width: 250px;
    padding: 16px 18px;
    text-align: center;
  }

  .header {
    display: table;
    width: 100%;
    margin: 0 auto 14px;
  }
  .header .mark {
    display: table-cell;
    width: 26px;
    vertical-align: middle;
  }
  .header .mark svg { width: 22px; height: 22px; display: block; }
  .header .wordmark {
    display: table-cell;
    vertical-align: middle;
    padding-left: 6px;
    font-size: 13px;
    font-weight: var(--font-weight-bold);
    color: var(--color-text);
    text-align: left;
  }

  /* Self-insight framing, reusing copy.partialResult.standoutLabel's
     language ("Your Standout Strength") rather than inventing new product
     language for the ad alone — same claim, same wording, ad and product
     in sync. This is the curiosity hook: the answer isn't knowable by
     looking at the ad, unlike the pattern-question build it replaced. */
  .headline {
    margin: 0 0 8px;
    font-size: 19px;
    font-weight: var(--font-weight-bold);
    line-height: 1.25;
    color: var(--color-text);
  }

  /* Matches the entry screen's existing claim exactly — no shorter/
     different time signal than the app itself delivers. */
  .subline {
    margin: 0 0 16px;
    font-size: 12px;
    color: var(--color-text-muted);
  }

  /* CTA promises the self-insight hook specifically, not a generic
     "Start" — the first build's mismatch was here (promising "find out"
     after the pattern answer was already visible). */
  .cta {
    display: block;
    box-sizing: border-box;
    width: 100%;
    text-align: center;
    background: var(--color-primary);
    color: var(--color-primary-contrast);
    font-family: var(--font-family);
    font-size: 14px;
    font-weight: var(--font-weight-bold);
    line-height: 44px;
    height: 44px;
    border-radius: var(--radius-sm);
  }
</style>
</head>
<body>
  <a class="wrap" href="../index.html" target="_top" style="text-decoration:none;color:inherit;">
    <div class="content">
      <div class="header">
        <span class="mark">
          <svg viewBox="0 0 64 64" aria-hidden="true">
            <circle cx="24" cy="24" r="14" fill="var(--color-primary)" opacity="0.85"/>
            <rect x="30" y="30" width="24" height="24" rx="4" fill="var(--color-primary)" opacity="0.55"/>
            <polygon points="16,52 28,52 22,40" fill="var(--color-primary)" opacity="0.7"/>
          </svg>
        </span>
        <span class="wordmark">IQly</span>
      </div>

      <p class="headline">What's your cognitive strength?</p>
      <p class="subline">Take a 2-Min IQ Test</p>

      <span class="cta">Try Free</span>
    </div>
  </a>
</body>
</html>
