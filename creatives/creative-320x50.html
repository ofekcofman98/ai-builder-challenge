<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>IQly — Banner 320x50</title>
<link rel="stylesheet" href="../styles/tokens.css">
<style>
  /* Creative-only layout. Colors/type/radius all come from tokens.css —
     no hardcoded hex values here, per part3-spec.md's shared build rule. */
  html, body {
    margin: 0;
    padding: 0;
    width: 320px;
    height: 50px;
    overflow: hidden;
    font-family: var(--font-family);
    background: var(--color-bg);
  }

  /* table/table-cell, not flexbox: the export renderer (old Qt WebKit,
     see docs/creatives/export.js) has unreliable flexbox support at this
     size, so this layout leans on box model primitives every WebKit build
     handles the same way. */
  a.banner {
    display: table;
    width: 320px;
    height: 50px;
    box-sizing: border-box;
    background: var(--color-bg);
    border: 1px solid var(--color-border);
    text-decoration: none;
    color: var(--color-text);
    border-collapse: collapse;
  }

  .cell {
    display: table-cell;
    vertical-align: middle;
  }

  /* Shrunk from 40px/28px so the CTA and subline can grow (docs/creative-fixes.md
     item 2), then grown back to 34px/26px — the brain mark reads as a bare
     sliver at 20px next to the full-size marks used everywhere else in the
     flow, and there's still ~166px of claim room at 34px, which the actual
     copy comfortably fits (verified by re-export, not assumed). */
  .mark {
    width: 34px;
    padding-left: 6px;
  }
  .mark svg { width: 26px; height: 26px; display: block; }

  /* Copy budget: mark stands alone (no text wordmark) — the ~166px of
     remaining width goes entirely to the value claim + CTA, per
     part3-spec.md's call to pick one, not fit both at full size.
     "Free" moved off the claim and into the CTA label ("Try Free") —
     it's the strongest lever on CVR, so it belongs in the button people
     tap, not in a muted sub-line next to it. */
  .claim {
    font-family: var(--font-heading);
    font-size: 15px;
    font-weight: var(--font-weight-bold);
    line-height: 1.1;
    color: var(--color-text);
  }
  /* Bumped from 10px muted-gray to 12px bold full-contrast — illegible at
     actual rendered size otherwise (docs/creative-fixes.md item 2). */
  .claim .sub {
    display: block;
    margin-top: 2px;
    font-size: 12px;
    font-weight: var(--font-weight-bold);
    color: var(--color-text);
  }

  /* Widened from 74px so the button reads as a real tap target, not a
     small label with padding around it (docs/creative-fixes.md item 2). */
  .cta-cell {
    width: 116px;
    padding-right: 8px;
    text-align: right;
  }
  /* Styled to read as a button (background, radius, weight) but a
     non-interactive <span>, not an actual <button> — nesting a <button>
     inside the wrapping <a> is invalid HTML (interactive content inside
     interactive content) and rendered inconsistently across engines,
     wkhtmltoimage's WebKit included. Confirmed as a defect in the first
     build; see part3-spec.md's Creative 1 implementation notes. */
  .cta {
    display: inline-block;
    box-sizing: border-box;
    width: 100%;
    text-align: center;
    background: var(--color-primary);
    color: var(--color-primary-contrast);
    font-family: var(--font-family);
    font-size: 15px;
    font-weight: var(--font-weight-bold);
    padding: 0 8px;
    height: 38px;
    line-height: 38px;
    border-radius: var(--radius-sm);
    white-space: nowrap;
  }
</style>
</head>
<body>
  <a class="banner" href="../index.html" target="_top">
    <span class="cell mark">
      <svg viewBox="0 0 64 64" width="26" height="26" aria-hidden="true">
        <path d="M32 6 C21 6 15 13 17 21 C8 23 6 33 15 37 C13 45 21 53 30 51 C31 56 33 56 34 51 C43 53 51 45 49 37 C58 33 56 23 47 21 C49 13 43 6 32 6 Z" fill="var(--color-primary)"/>
        <path d="M32 9 C30.5 20 30.5 44 32 53" stroke="var(--color-bg)" stroke-width="5" stroke-linecap="round"/>
      </svg>
    </span>
    <span class="cell claim">
      What's your IQ?
      <span class="sub">2 min quiz</span>
    </span>
    <span class="cell cta-cell">
      <span class="cta">Try Free</span>
    </span>
  </a>
</body>
</html>
