<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>IQly — Full-Screen 1080x1920 (Build B, bonus — not the PNG deliverable)</title>
<link rel="stylesheet" href="../styles/tokens.css">
<style>
  /* Bonus HTML-only demo — never exported to PNG, never a substitute for
     creative-1080x1920.html's Build A (the actual PNG deliverable). See
     part3-spec.md's ad-serving-constraint note: a *served* image creative
     has exactly one click-through URL for the whole image, so per-answer
     deep-linking can only exist here, outside that constraint. Layout
     mirrors Build A; see that file for the shared rationale on tokens.css
     colors and table/table-cell over flexbox. */
  html, body {
    margin: 0;
    padding: 0;
    width: 1080px;
    height: 1920px;
    overflow: hidden;
    font-family: var(--font-family);
    background: var(--color-bg);
  }

  .wrap {
    display: table;
    box-sizing: border-box;
    width: 1080px;
    height: 1920px;
  }
  .content {
    display: table-cell;
    vertical-align: middle;
    box-sizing: border-box;
    width: 1080px;
    padding: 0 64px;
  }

  .header {
    display: table;
    width: 100%;
  }
  .header .mark {
    display: table-cell;
    width: 68px;
    vertical-align: middle;
  }
  .header .mark svg { width: 60px; height: 60px; display: block; }
  .header .wordmark {
    display: table-cell;
    vertical-align: middle;
    padding-left: 16px;
    font-size: 40px;
    font-weight: var(--font-weight-bold);
    color: var(--color-text);
  }

  .headline {
    margin: 64px 0 8px;
    font-size: 64px;
    font-weight: var(--font-weight-bold);
    line-height: 1.15;
    color: var(--color-text);
  }
  .subheadline {
    margin: 0 0 56px;
    font-size: 32px;
    color: var(--color-text-muted);
  }

  .question-card {
    box-sizing: border-box;
    width: 100%;
    padding: 48px 44px;
    background: var(--color-surface);
    border-radius: var(--radius-md);
  }
  .question-prompt {
    margin: 0 0 36px;
    font-size: 44px;
    font-weight: var(--font-weight-medium);
    line-height: 1.3;
    color: var(--color-text);
  }

  .question-visual {
    text-align: center;
    margin: 0 0 36px;
  }

  /* Unlike Build A, each option is a real click zone: index.html?q1=<i>
     pre-fills that answer and advances state past Q1 on landing, so the
     user is never re-asked the question they just answered here — see
     src/main.js's readAnswerParam(). q1 is now the icon-rendered matrix
     question (see questions.js's comment on q1 for why it moved to this
     position), so options render as a 2x2 icon grid rather than a single
     text column — same table-cell approach as Build A's .option-grid-table
     (wkhtmltoimage predates CSS Grid; see creatives/export.js), but each
     cell is a real per-answer link here instead of static preview content. */
  .option-grid-table {
    width: 100%;
    border-collapse: separate;
    border-spacing: 20px;
    margin: -20px;
  }
  a.option {
    display: block;
    box-sizing: border-box;
    width: 100%;
    padding: 32px;
    background: var(--color-bg);
    border: 2px solid var(--color-border);
    border-radius: var(--radius-sm);
    text-align: center;
    text-decoration: none;
  }
  /* No width/height here — sized in JS as a percentage of each option's
     own rendered width instead. Same fix as creative-1080x1920.html's
     .option-cell .option-icon (identical hardcoded-96px issue, separate
     stylesheet); see that file's comment on why not CSS aspect-ratio.
     Build B is never exported through wkhtmltoimage, but keeping both
     creatives on the same sizing approach avoids two different bugs to
     track for what's visually the same component. */
  a.option .option-icon {
    display: block;
    margin: 0 auto 16px;
  }
  a.option .option-label {
    display: block;
    font-size: 32px;
    color: var(--color-text);
  }

  a.cta-banner {
    display: block;
    box-sizing: border-box;
    width: 100%;
    margin-top: 72px;
    padding: 0 32px;
    height: 128px;
    line-height: 128px;
    text-align: center;
    background: var(--color-primary);
    color: var(--color-primary-contrast);
    font-size: 44px;
    font-weight: var(--font-weight-bold);
    border-radius: var(--radius-md);
    text-decoration: none;
  }

  .microcopy {
    margin: 32px 0 0;
    font-size: 28px;
    color: var(--color-text-muted);
    text-align: center;
  }
</style>
</head>
<body>
  <div class="wrap">
    <div class="content">
      <div class="header">
        <span class="mark">
          <svg viewBox="0 0 64 64" aria-hidden="true">
            <circle cx="24" cy="24" r="14" fill="var(--color-primary)" opacity="0.85"/>
            <rect x="30" y="30" width="24" height="24" rx="4" fill="var(--color-primary)" opacity="0.55"/>
            <polygon points="16,52 28,52 22,40" fill="var(--color-primary)" opacity="0.7"/>
          </svg>
        </span>
        <span class="wordmark">IQly</span>
      </div>

      <p class="headline">What's your IQ?</p>
      <p class="subheadline">Free · about 3 minutes · no signup to start</p>

      <div class="question-card">
        <p class="question-prompt" id="question-prompt"></p>
        <div class="question-visual" id="question-visual"></div>
        <table class="option-grid-table" role="presentation" id="option-grid"></table>
      </div>

      <!-- Fallback for a viewer who taps outside an answer: still lands
           on Q1 directly (Build A's mechanism), just without a pre-filled
           answer. -->
      <a class="cta-banner" href="../index.html?skip=entry" target="_top">Or jump to the quiz &rarr;</a>
      <p class="microcopy">Tap an answer to submit it and continue instantly</p>
    </div>
  </div>

  <!-- Real question content, not invented: pulls q1 straight from the
       quiz source. q1 is the icon-rendered 3x3 matrix question (moved to
       this array position specifically so this creative's deep link could
       target it — see questions.js's comment on q1); this creative's whole
       mechanism (?qN=<index> pre-fills that answer and advances state past
       it) only ever works for the FIRST unanswered question — src/main.js's
       readAnswerParam() parses the index straight from the qN param name
       and only honors index 0 — so q1 is the only question this deep link
       could ever validly target, which is exactly why it moved here rather
       than staying at position 6. -->
  <script src="../src/questions.js"></script>
  <script>
    (function () {
      var q = IQLY.QUESTIONS.filter(function (item) { return item.id === 'q1'; })[0];

      // window.__IQLY_TOKENS__ is set only by creatives/export.js's export
      // pass — see creative-1080x1920.html's identical helper for why.
      function resolveTokens(svgMarkup) {
        if (!window.__IQLY_TOKENS__) return svgMarkup;
        return svgMarkup.replace(/var\((--[a-z0-9-]+)\)/gi, function (full, name) {
          return window.__IQLY_TOKENS__[name] || full;
        });
      }

      document.getElementById('question-prompt').textContent = q.prompt;

      var visualEl = document.getElementById('question-visual');
      visualEl.innerHTML = resolveTokens(q.render());

      // svgGridMatrix() ships explicit width/height pixel attributes sized
      // for the live quiz's compact question-content budget — pin this
      // creative's own larger target size the same way Build A does.
      var visualSvg = visualEl.getElementsByTagName('svg')[0];
      var vb = visualSvg.getAttribute('viewBox').split(' ');
      var vbWidth = parseFloat(vb[2]);
      var vbHeight = parseFloat(vb[3]);
      var targetWidth = 600;
      visualSvg.setAttribute('width', targetWidth);
      visualSvg.setAttribute('height', Math.round((vbHeight / vbWidth) * targetWidth));

      // Shared canvas size across all 4 options — see src/questions.js's
      // optionIcon() comment for why a per-option size is wrong.
      var maxCount = Math.max.apply(null, q.optionShapes.map(function (s) { return s.count; }));
      var iconCanvasSize = IQLY.iconCanvasSize(maxCount);

      var gridEl = document.getElementById('option-grid');
      var html = '';
      q.options.forEach(function (option, i) {
        var shapeSpec = q.optionShapes[i];
        var icon = resolveTokens(IQLY.optionIcon(shapeSpec.shape, shapeSpec.count, iconCanvasSize));
        if (i % 2 === 0) html += '<tr>';
        html += '<td><a class="option" href="../index.html?q1=' + i + '" target="_top">' +
          icon + '<span class="option-label">' + option + '</span></a></td>';
        if (i % 2 === 1) html += '</tr>';
      });
      gridEl.innerHTML = html;

      // Icon = 44% of its own option's rendered width — see .option-icon's
      // comment. Sized against the <a>, not the <td>, since the <a> is the
      // element with the actual padding/border box the icon sits inside.
      var options = gridEl.getElementsByClassName('option');
      Array.prototype.forEach.call(options, function (optionEl) {
        var icon = optionEl.getElementsByClassName('option-icon')[0];
        var size = Math.round(optionEl.clientWidth * 0.44);
        icon.setAttribute('width', size);
        icon.setAttribute('height', size);
        icon.style.width = size + 'px';
        icon.style.height = size + 'px';
      });
    })();
  </script>
</body>
</html>
